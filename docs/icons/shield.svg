<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="shieldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#7B241C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Base Circle -->
  <circle cx="54" cy="54" r="50" fill="#0D0907" stroke="#332415" stroke-width="2"/>
  <circle cx="54" cy="54" r="44" fill="#16110D" stroke="#4A330B" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Golden Shield Outer -->
  <g transform="translate(27, 25) scale(2.25)" filter="url(#shadow)">
    <!-- Base Shield -->
    <path d="M12,1 L3,5 v6 c0,5.55 3.84,10.74 9,12 c5.16,-1.26 9,-6.45 9,-12 V5 L12,1 z" fill="url(#shieldGold)" stroke="#3D2B0F" stroke-width="0.8"/>
    <!-- Left Highlight Facet -->
    <path d="M12,2 L4.5,5.4 v5.6 c0,4.6 3.1,8.9 7.5,10.2 V2 z" fill="#FFF2B2" opacity="0.35"/>
    <!-- Inner Dark Cavity -->
    <path d="M12,4.5 L6,7.5 v4 c0,3.8 2.5,7.2 6,8.2 c3.5,-1 6,-4.4 6,-8.2 v-4 L12,4.5 z" fill="#120B06"/>
    <!-- Inner Golden Cross Crest -->
    <path d="M12,6 L7.5,8.5 v3 c0,2.8 1.9,5.5 4.5,6.3 c2.6,-0.8 4.5,-3.5 4.5,-6.3 v-3 L12,6 z" fill="url(#shieldGold)"/>
    <!-- Central Ember / Horadric Eye Gem -->
    <polygon points="12,9.5 14.5,12 12,14.5 9.5,12" fill="url(#innerGlow)" stroke="#F5B7B1" stroke-width="0.3"/>
  </g>
</svg>
